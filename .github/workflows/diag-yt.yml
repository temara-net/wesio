name: diag-yt
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Pasang yt-dlp + plugin PO token bgutil
        shell: bash
        run: |
          set +e
          pip install -q "yt-dlp>=2024.8.6" bgutil-ytdlp-pot-provider
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider /tmp/bgutil
          cd /tmp/bgutil/server && npm install --no-audit --no-fund 2>&1 | tail -1 && npx tsc 2>&1 | tail -1
          ls build/ | head -3
      - name: Jalankan server PO + uji Shorts sehat
        shell: bash
        run: |
          set +e
          (node /tmp/bgutil/server/build/main.js > /tmp/po.log 2>&1 &)
          sleep 3
          curl -s http://127.0.0.1:4416/ping || echo "server PO tidak menjawab"
          U="https://www.youtube.com/shorts/BCaCmDrc_mM"
          timeout 90 python3 -m yt_dlp -j --no-warnings "$U" > /tmp/j.txt 2> /tmp/e.txt; echo "rc=$?"
          grep -o '"title": *"[^"]*"' /tmp/j.txt | head -1
          grep -o "ERROR: .*" /tmp/e.txt | head -c 250; echo
          tail -3 /tmp/po.log
