name: set-ai-secrets
on:
  workflow_dispatch:
jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tulis secret AI ke Worker wesio
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          data = {
            "AI_API_KEY": os.environ["AI_API_KEY"],
            "AI_BASE_URL": "https://generativelanguage.googleapis.com/v1beta/openai/",
            "AI_MODEL_FAST": "gemini-3.5-flash,gemini-3-flash-preview,gemini-2.5-flash,gemini-flash-latest",
            "AI_MODEL_STRONG": "gemini-2.5-pro",
          }
          open(".secrets.json", "w").write(json.dumps(data))
          print("secret disiapkan:", ", ".join(data.keys()))
          PY
          npx -y wrangler@3 secret bulk .secrets.json
          rm -f .secrets.json
