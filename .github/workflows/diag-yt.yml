name: diag-yt
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install yt-dlp
        run: pip install -q "yt-dlp>=2024.8.6" curl_cffi
      - name: Rotasi klien YouTube pada Shorts sehat
        shell: bash
        run: |
          set +e
          U="https://www.youtube.com/shorts/BCaCmDrc_mM"
          for c in android ios tv web_embedded mweb; do
            echo "=== client=$c"
            timeout 60 python3 -m yt_dlp -j --no-warnings --extractor-args "youtube:player_client=$c" "$U" > /tmp/j.txt 2> /tmp/e.txt
            echo "rc=$?"
            grep -o '"title": *"[^"]*"' /tmp/j.txt | head -1
            grep -o "ERROR: .*" /tmp/e.txt | head -c 200; echo
          done
          echo "=== client=android + impersonate chrome"
          timeout 60 python3 -m yt_dlp -j --no-warnings --extractor-args "youtube:player_client=android" --impersonate chrome "$U" > /tmp/j.txt 2> /tmp/e.txt
          echo "rc=$?"
          grep -o '"title": *"[^"]*"' /tmp/j.txt | head -1
          grep -o "ERROR: .*" /tmp/e.txt | head -c 200; echo
