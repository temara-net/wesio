name: diag-yt
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install yt-dlp
        run: pip install -q "yt-dlp>=2024.8.6"
      - name: Uji unduh Douyin dari tautan berbagi asli
        shell: bash
        run: |
          set +e
          for U in "https://v.douyin.com/qpMfgM5vbuY/" "https://v.douyin.com/ikq8axJ/"; do
            echo "=== $U"
            timeout 60 python3 -m yt_dlp -j --no-warnings "$U" > /tmp/j.txt 2> /tmp/e.txt; echo "metadata rc=$?"
            grep -o '"title": *"[^"]*"\|"id": *"[0-9]*"' /tmp/j.txt | head -2
            grep -o "ERROR: .*" /tmp/e.txt | head -c 220; echo
            rm -rf /tmp/dl && mkdir -p /tmp/dl
            timeout 120 python3 -m yt_dlp -f "b/bv*+ba" --merge-output-format mp4 --max-filesize 50M --no-playlist --no-warnings -o "/tmp/dl/%(title).60s.%(ext)s" "$U" > /tmp/o.txt 2> /tmp/e2.txt; echo "unduh rc=$?"
            tail -1 /tmp/e2.txt; ls -la /tmp/dl/ | tail -2
          done
