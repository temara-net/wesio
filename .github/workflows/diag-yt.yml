name: diag-yt
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install yt-dlp
        run: pip install -q "yt-dlp>=2024.8.6"
      - name: Real download attempts (production command)
        run: |
          which ffmpeg || echo "TIDAK ADA FFMPEG"
          coba() {
            echo "=== $1"
            rm -rf /tmp/dl && mkdir -p /tmp/dl
            timeout 240 python3 -m yt_dlp -f "bv*[height<=720]+ba/b[height<=720]/bv*+ba/b" --merge-output-format mp4 --max-filesize 50M --no-playlist --no-warnings -o "/tmp/dl/%(title).80s.%(ext)s" "$2" 2>/tmp/err.txt | tail -3
            echo "--- stderr terakhir:"; tail -3 /tmp/err.txt
            echo "--- berkas:"; ls -la /tmp/dl/ | tail -3
          }
          coba "kontrol-publik" "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
          coba "shorts-dea" "https://www.youtube.com/shorts/pnt4wn4lSwQ"
