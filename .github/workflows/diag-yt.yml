name: diag-yt
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install yt-dlp
        run: pip install -q "yt-dlp>=2024.8.6" curl_cffi
      - name: Probe strategies
        run: |
          probe() {
            echo "=== $1"
            timeout 60 yt-dlp -j --no-warnings $3 "$2" 2>/tmp/err.txt | head -c 200 | grep -o '"title": *"[^"]*"' || true
            tail -2 /tmp/err.txt
          }
          probe "kontrol-video-publik-default" "https://www.youtube.com/watch?v=dQw4w9WgXcQ" ""
          probe "kontrol-video-publik-android" "https://www.youtube.com/watch?v=dQw4w9WgXcQ" "--extractor-args youtube:player_client=android"
          probe "video-dea-bentuk-watch" "https://www.youtube.com/watch?v=pnt4wn4lSwQ" ""
          probe "video-dea-shorts-android" "https://www.youtube.com/shorts/pnt4wn4lSwQ" "--extractor-args youtube:player_client=android"
