name: diag-yt
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install yt-dlp
        run: pip install -q "yt-dlp>=2024.8.6"
      - name: Probe pencarian Douyin
        shell: bash
        run: |
          set +e
          echo "=== extractor douyin yt-dlp:"
          python3 -m yt_dlp --list-extractors 2>/dev/null | grep -i douyin
          echo "=== A) endpoint search web Douyin mentah"
          timeout 30 curl -s "https://www.douyin.com/aweme/v1/web/search/item/?keyword=%E7%8C%AB&count=5" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" -H "Referer: https://www.douyin.com/" -o /tmp/dy.json -w "http=%{http_code} bytes=%{size_download}\n"
          head -c 200 /tmp/dy.json; echo
          echo "=== B) indeks Bing site:douyin.com/video"
          timeout 30 curl -s "https://www.bing.com/search?q=site%3Adouyin.com%2Fvideo+%E7%8C%AB&count=20" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" -o /tmp/bing.html -w "http=%{http_code} bytes=%{size_download}\n"
          grep -o "douyin\.com/video/[0-9]*" /tmp/bing.html | sort -u | head -8
          echo "jumlah tautan video unik: $(grep -o "douyin\.com/video/[0-9]*" /tmp/bing.html | sort -u | wc -l)"
      - name: Uji unduh satu video Douyin hasil indeks
        shell: bash
        run: |
          set +e
          timeout 30 curl -s "https://www.bing.com/search?q=site%3Adouyin.com%2Fvideo+%E7%8C%AB&count=20" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" -o /tmp/bing.html
          VID=$(grep -o "douyin\.com/video/[0-9]*" /tmp/bing.html | sort -u | head -1)
          echo "video uji: $VID"
          if [ -n "$VID" ]; then
            timeout 60 python3 -m yt_dlp -j --no-warnings "https://www.$VID" > /tmp/j.txt 2> /tmp/e.txt; echo "metadata rc=$?"
            grep -o '"title": *"[^"]*"' /tmp/j.txt | head -1
            grep -o "ERROR: .*" /tmp/e.txt | head -c 200; echo
            rm -rf /tmp/dl && mkdir -p /tmp/dl
            timeout 120 python3 -m yt_dlp -f "b/bv*+ba" --merge-output-format mp4 --max-filesize 50M --no-playlist --no-warnings -o "/tmp/dl/%(title).60s.%(ext)s" "https://www.$VID" > /tmp/o.txt 2> /tmp/e2.txt; echo "unduh rc=$?"
            cat /tmp/e2.txt | tail -2; ls -la /tmp/dl/
          fi
